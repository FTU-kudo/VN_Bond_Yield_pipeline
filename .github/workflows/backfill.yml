name: Backfill TPCP lich su (chay tay)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Ngay bat dau (YYYY-MM-DD)"
        required: true
        default: "2012-01-01"
      end_date:
        description: "Ngay ket thuc (de trong = hom nay)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Backfill dai that (uoc luong 30-90 phut cho toan bo 2012-nay) nhung
    # van phai co tran — bai hoc tu vu CW_pipeline_daily tung treo 3 tieng
    # vi mot vong lap khong co gioi han lan thu / ngan sach thoi gian.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Chay backfill
        run: |
          if [ -z "${{ github.event.inputs.end_date }}" ]; then
            python run_pipeline.py --mode full --start "${{ github.event.inputs.start_date }}"
          else
            python run_pipeline.py --mode full --start "${{ github.event.inputs.start_date }}" --end "${{ github.event.inputs.end_date }}"
          fi

      - name: Commit du lieu moi neu co
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/ exports/
          git diff --cached --quiet || git commit -m "Backfill TPCP: ${{ github.event.inputs.start_date }} -> ${{ github.event.inputs.end_date }}"
          git pull --rebase origin main || true
          git push

